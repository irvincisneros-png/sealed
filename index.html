<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>SEALED: crack the vault</title>
<meta name="description" content="Probe a sealed vault, build a model from your data, then see how close you got. A Year 8 Science game about scientific models.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='4' fill='%23222a33' stroke='%23ffb020' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%2335d0e6' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<style>
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#07090c;color:#e8edf2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;transition:opacity .35s}
#boot.done{opacity:0;pointer-events:none}
#boot h1{margin:0;font-size:clamp(40px,12vw,72px);font-weight:800;letter-spacing:.14em;color:#ffb020}
#boot p{margin:0;font-size:16px;color:#93a0ad}
#boot .bar{width:min(240px,70vw);height:6px;border-radius:99px;background:#2b333d;overflow:hidden}
#boot .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#ffb020;animation:bootslide 1.2s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#boot .bar i{animation:none;width:100%;opacity:.6}}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/" } }
</script>
</head>
<body>
<div id="boot" role="status" aria-live="polite"><h1>SEALED</h1><p>Loading the vault…</p><div class="bar" aria-hidden="true"><i></i></div></div>
<script>
(function(){var b=document.getElementById('boot'),d=false;
function hide(){if(d)return;d=true;b.classList.add('done');setTimeout(function(){b.remove()},500)}
window.__hideBoot=hide;setTimeout(hide,20000);
addEventListener('error',hide,true);addEventListener('unhandledrejection',hide)})();
</script>
<canvas id="stage" aria-label="3D view of the sealed vault" role="img"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:2rem;color:#fff">SEALED needs JavaScript and WebGL to run.</p></noscript>
<script type="module" src="src/main.js"></script>
<script src="https://irvincisneros-png.github.io/assets/hub-link.js" data-position="bottom-left" data-year="8" data-theme="dark" defer></script>
</body>
</html>
